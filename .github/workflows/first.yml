name: first workflow
on: 
  push:
  pull_request: 
    # branches: 
    #   - master
    #   - dev
    #   - qa

jobs:
    first-job:
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v4
              
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: 'npm'

            - name: Install dependency
              run: npm ci

            - name: ES-lint
              run: npm run lint

            - name: unit test case
              run: npm test

            - name: make react build
              run: npm run build
