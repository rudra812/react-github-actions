name: first workflow
on: 
  push:
  pull_request: 
    # branches: 
    #   - master
    #   - dev
    #   - qa

jobs:
    lint-job:
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v4
              
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: 'npm'

            - name: Install dependency
              run: npm ci

            - name: ES-lint
              run: npm run lint

    test-job:
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v4
              
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: 'npm'

            - name: Install dependency
              run: npm ci

            - name: unit test case
              run: npm test

    build-job:
        needs: [lint-job, test-job]
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v4
              
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: 'npm'

            - name: Install dependency
              run: npm ci

            - name: make react build
              run: npm run build

            - name: create artifact
              uses: actions/upload-artifact@v4
              with:
                  name: react-build
                  path: dist/
                  retention-days: 7