name: first workflow
on: 
  push:
  pull_request: 


jobs:
    first-job:
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v4
              
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: 'npm'

            - name: Install dependency
              run: npm ci

            - name: make react build
              run: npm run build
